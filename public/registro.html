<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Foro</title>
</head>
<body>
    <form id = "form-register">
        <label for ="name">Nombre:</label>
        <input type="text" id ="name" placeholder="Ingresa tu nombre" required> 
        <br>
        <label for ="father-lastname">Apellido paterno:</label>
        <input type ="text" id ="father-lastname" placeholder ="Ingresa tu primer apellido" required>
        <br>
        <label for ="mother-lastname">Apellido materno:</label>
        <input type ="text" id ="mother-lastname" placeholder="Ingresa tu segundo apellido">
        <br>
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" placeholder="ejemplo@correo.com" required>    
        <br>   
        <label for ="username">Nombre de usuario:</label>
        <input type ="text" id ="username" placeholder="Ingresa tu username" required>
        <br>
        <label for ="password">Contraseña:</label>
        <input type ="password" id ="password" placeholder="Ingresa tu contraseña" required>
        <br>
        <input type ="password" id ="confirm-password" placeholder="Confirma tu contraseña" required>
        <br>
        <button type ="submit">Registrarse</button>
    </form>
    <p id ="estado-registro"></p>

</body>
<script src ="register.js"></script>

</html>
