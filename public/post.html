<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foro CUCEI — Publicación</title>
<link rel="stylesheet" href="foro-styles.css">
</head>
<body>

<header class="site-header">
  <div class="brand">Foro <span>CUCEI</span></div>
  <div class="header-right">
    <span id="saludo-usuario" class="saludo"></span>
    <button id="btn-logout" class="btn-ghost">Cerrar sesión</button>
  </div>
</header>

<main class="page page-narrow">

  <a href="foro.html" class="back">Volver al foro</a>

  <div id="post-detalle" class="card post-detalle"></div>

  <div id="post-resolver-box" class="resolver-box" hidden>
    <span>¿Ya tienes lo que necesitabas?</span>
    <button id="btn-resolver" class="btn">Marcar como resuelta</button>
  </div>

  <section class="comentarios-section">
    <h2>Respuestas</h2>
    <div id="lista-comentarios" class="lista-comentarios"></div>

    <form id="form-comentario" class="card comentario-form">
      <div class="field">
        <label for="input-comentario">Escribe una respuesta</label>
        <textarea id="input-comentario" required></textarea>
      </div>
      <p id="comentario-error" class="form-error" hidden></p>
      <button type="submit" class="btn">Responder</button>
    </form>
  </section>

</main>

<script src="js/post.js"></script>
</body>
</html>
