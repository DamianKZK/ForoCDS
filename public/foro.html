<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foro CUCEI</title>
<link rel="stylesheet" href="foro-styles.css">
</head>
<body>

<header class="site-header">
  <div class="brand">Foro <span>CUCEI</span></div>
  <div class="header-right">
    <span id="saludo-usuario" class="saludo"></span>
    <button id="btn-logout" class="btn-ghost">Cerrar sesión</button>
  </div>
</header>

<main class="page">

  <div class="feed-top">
    <div id="categoria-chips" class="chip-row">
      <button class="chip is-active">Todas</button>
    </div>
    <button id="btn-nuevo-post" class="btn">Nueva publicación</button>
  </div>

  <div id="post-form" class="card post-form" hidden>
    <h2>Nueva publicación</h2>
    <form id="form-crear-post">
      <div class="field">
        <label for="input-categoria">Categoría</label>
        <select id="input-categoria" required>
          <option value="" disabled selected>Selecciona una categoría</option>
        </select>
      </div>

      <div class="field">
        <label for="input-titulo">Título</label>
        <input type="text" id="input-titulo" required>
      </div>

      <div class="field">
        <label for="input-contenido">Contenido</label>
        <textarea id="input-contenido" required></textarea>
        <div id="contador-caracteres" class="contador">0 / 150</div>
      </div>

      <div class="field">
        <label for="input-imagen">Imagen (opcional, solo .png)</label>
        <input type="file" id="input-imagen" accept="image/png">
        <div id="imagen-ayuda" class="ayuda"></div>
      </div>

      <p id="form-error" class="form-error" hidden></p>

      <div class="form-actions">
        <button type="submit" class="btn">Publicar</button>
        <button type="button" id="btn-cancelar-post" class="btn-ghost">Cancelar</button>
      </div>
    </form>
  </div>

  <p id="feed-count" class="feed-count"></p>
  <div id="feed" class="feed"></div>
  <p id="feed-empty" class="feed-empty" hidden>Aún no hay publicaciones en esta categoría.</p>

</main>

<script src="js/foro.js"></script>
</body>
</html>
