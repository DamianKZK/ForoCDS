<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administración · Foro CUCEI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&amp;family=DM+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link rel="stylesheet" href="foro-styles.css?v=3">
<script src="js/theme.js?v=3"></script>
</head>
<body>

<header class="topbar">
  <div class="topbar__in">
    <a class="brand" href="foro.html">
      <span class="brand__logo"><img class="brand__img brand__img--light" src="img/logo-claro.svg" alt=""><img class="brand__img brand__img--dark" src="img/logo-oscuro.svg" alt=""></span>
      <span class="brand__text"><span class="brand__name">Foro <span class="brand__cu">CUCEI</span></span><span class="brand__sub">COMUNIDAD ESTUDIANTIL</span></span>
    </a>
    <div class="topbar__right">
      <button class="iconbtn" type="button" data-theme-toggle aria-label="Cambiar entre tema claro y oscuro">
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <div class="usermenu">
        <button class="usermenu__btn" type="button" id="user-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="user-panel">
          <span class="avatar" id="user-initial">A</span>
          <span id="user-name">Usuario</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="usermenu__panel" id="user-panel" role="menu" hidden>
          <button class="usermenu__item" type="button" role="menuitem" id="logout">Cerrar sesión</button>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="post-main">
  <a class="back" href="foro.html">← Volver al foro</a>

  <section class="answers">
    <div class="answers__head">
      <h2>Administración</h2>
      <span>Asigna o quita el rol de admin a los miembros del comité</span>
    </div>

    <div class="search" style="max-width:none;margin:0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <label class="sr-only" for="user-search">Buscar usuarios</label>
      <input id="user-search" type="search" placeholder="Buscar por nombre o correo" autocomplete="off">
    </div>

    <div class="form-msg" id="admin-msg" role="status"></div>
    <div id="users" style="display:flex;flex-direction:column;gap:12px" aria-live="polite"></div>
  </section>
</main>

<script src="js/api.js?v=3"></script>
<script src="js/admin.js?v=3"></script>
</body>
</html>
