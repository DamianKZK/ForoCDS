<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foro CUCEI — Acceso</title>
<link rel="stylesheet" href="foro-styles.css">
</head>
<body class="auth-body">

<div class="auth-wrap">
  <div class="brand brand-center">Foro <span>CUCEI</span></div>

  <div class="card auth-card">
    <div class="tabs">
      <button class="tab active" id="tabLogin" onclick="setMode('login')">Iniciar sesión</button>
      <button class="tab" id="tabRegister" onclick="setMode('register')">Registrarse</button>
      <div class="tab-indicator" id="tabIndicator"></div>
    </div>

    <div class="tab-panels-outer" id="panelsOuter">
      <div class="tab-panels" id="tabPanels">

        <!-- ===== LOGIN ===== -->
        <div class="panel" id="panelLogin">
          <h1>Bienvenido de vuelta</h1>
          <p class="lead">Accede para participar en el foro.</p>

          <form id="form-login">
            <div class="field">
              <label for="campo-email">Correo electrónico</label>
              <input type="email" id="campo-email" required autocomplete="username">
            </div>
            <div class="field">
              <label for="campo-password">Contraseña</label>
              <div class="pw-wrap">
                <input type="password" id="campo-password" required autocomplete="current-password">
                <button type="button" class="pw-toggle" onclick="togglePw(this)" aria-label="Mostrar contraseña">
                  <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 4.22-5.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
              </div>
            </div>
            <p id="mensaje-estado" class="mensaje-estado"></p>
            <button class="btn" type="submit">Iniciar sesión</button>
          </form>
        </div>

        <!-- ===== REGISTRO ===== -->
        <div class="panel" id="panelRegister">
          <h1>Crear cuenta</h1>
          <p class="lead">Regístrate para participar en el foro.</p>

          <form id="form-registro">
            <div class="field">
              <label for="reg-nombre">Nombre completo</label>
              <input type="text" id="reg-nombre" required>
            </div>
            <div class="field">
              <label for="reg-email">Correo electrónico</label>
              <input type="email" id="reg-email" required autocomplete="username">
            </div>
            <div class="field">
              <label for="reg-password">Contraseña</label>
              <div class="pw-wrap">
                <input type="password" id="reg-password" required autocomplete="new-password">
                <button type="button" class="pw-toggle" onclick="togglePw(this)" aria-label="Mostrar contraseña">
                  <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 4.22-5.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
              </div>
            </div>
            <div class="field">
              <label for="reg-confirmar">Confirmar contraseña</label>
              <div class="pw-wrap">
                <input type="password" id="reg-confirmar" required autocomplete="new-password">
                <button type="button" class="pw-toggle" onclick="togglePw(this)" aria-label="Mostrar contraseña">
                  <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 4.22-5.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
              </div>
            </div>
            <p id="reg-mensaje-estado" class="mensaje-estado"></p>
            <button class="btn" type="submit">Crear cuenta</button>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="js/ui.js"></script>
<script src="js/tabs.js"></script>
<script src="js/app.js"></script>
<script src="js/registro.js"></script>
</body>
</html>
