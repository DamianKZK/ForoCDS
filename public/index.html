<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foro CUCEI · Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&amp;family=DM+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link rel="stylesheet" href="foro-styles.css?v=3">
<script src="js/theme.js?v=3"></script>
</head>
<body class="auth-page">
<div class="auth-shape auth-shape--1" aria-hidden="true"></div>
<div class="auth-shape auth-shape--2" aria-hidden="true"></div>

<button class="iconbtn auth-theme" type="button" data-theme-toggle aria-label="Cambiar entre tema claro y oscuro">
  <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>

<main class="auth">
  <section class="auth-intro">
    <a class="brand" href="index.html">
      <span class="brand__logo"><img class="brand__img brand__img--light" src="img/logo-claro.svg" alt=""><img class="brand__img brand__img--dark" src="img/logo-oscuro.svg" alt=""></span>
      <span class="brand__name" style="font-size:26px">Foro <span class="brand__cu">CUCEI</span></span>
    </a>
    <h1>¿Tienes una duda del CUCEI? <mark>Pregúntala aquí.</mark></h1>
    <p>Estudiantes, profesores y comité se responden entre sí. Las respuestas oficiales van primero y tú decides cuándo tu duda quedó resuelta.</p>
    <div class="auth-chips">
      <span>Dudas</span><span>Trámites</span><span>Anuncios</span>
    </div>
  </section>

  <section class="auth-card" aria-label="Acceso al foro">
    <div class="tabs-pill" role="tablist" aria-label="Acceso">
      <button type="button" role="tab" id="tab-login" data-tab="login" aria-selected="true" aria-controls="panel-login">Iniciar sesión</button>
      <button type="button" role="tab" id="tab-registro" data-tab="registro" aria-selected="false" aria-controls="panel-registro" tabindex="-1">Crear cuenta</button>
    </div>

    <div class="auth-viewport">
      <div class="auth-track" id="auth-track" data-active="login">

        <!-- LOGIN -->
        <form method="post" action="#" class="auth-panel" id="panel-login" data-panel="login" role="tabpanel" aria-labelledby="tab-login" novalidate>
          <div class="form-msg form-msg--ok" id="login-ok" role="status"></div>
          <div class="field">
            <label for="login-email">Correo</label>
            <input class="input" id="login-email" name="email" type="email" autocomplete="email" required>
            <div class="field-error" id="login-email-error" role="alert"></div>
          </div>
          <div class="field">
            <label for="login-password">Contraseña</label>
            <div class="input-wrap">
              <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" required>
              <button class="input-wrap__btn" type="button" data-toggle-pass="login-password" aria-label="Mostrar u ocultar contraseña">
                <svg class="eye" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>
              </button>
            </div>
          </div>
          <div class="form-msg form-msg--error" id="login-error" role="alert"></div>
          <button class="btn btn--primary btn--block" id="login-submit" type="submit">Entrar al foro</button>
        </form>

        <!-- REGISTRO -->
        <form method="post" action="#" class="auth-panel" id="panel-registro" data-panel="registro" role="tabpanel" aria-labelledby="tab-registro" novalidate inert>
          <div class="field">
            <label for="reg-nombre">Nombre</label>
            <input class="input" id="reg-nombre" name="nombre" type="text" autocomplete="name" required>
            <div class="field-error" id="reg-nombre-error" role="alert"></div>
          </div>
          <div class="field">
            <label for="reg-email">Correo</label>
            <input class="input" id="reg-email" name="email" type="email" autocomplete="email" required>
            <div class="field-error" id="reg-email-error" role="alert"></div>
          </div>
          <div class="field">
            <label for="reg-password">Contraseña</label>
            <div class="input-wrap">
              <input class="input" id="reg-password" name="password" type="password" autocomplete="new-password" required>
              <button class="input-wrap__btn" type="button" data-toggle-pass="reg-password" aria-label="Mostrar u ocultar contraseña">
                <svg class="eye" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>
              </button>
            </div>
            <div class="field-error" id="reg-password-error" role="alert"></div>
            <div class="strength" id="reg-strength" data-level="0" hidden>
              <div class="strength__bars" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
              <span class="strength__label" id="reg-strength-label"></span>
            </div>
          </div>
          <div class="form-msg form-msg--error" id="reg-error" role="alert"></div>
          <button class="btn btn--primary btn--block" id="reg-submit" type="submit" disabled>Crear cuenta</button>
        </form>

      </div>
    </div>
  </section>
</main>

<script src="js/api.js?v=3"></script>
<script src="js/ui.js?v=3"></script>
<script src="js/tabs.js?v=3"></script>
<script src="js/registro.js?v=3"></script>
<script src="js/app.js?v=3"></script>
</body>
</html>
