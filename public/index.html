<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foro - Calidad del software</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="card">
        <h2>Iniciar Sesión</h2>
        
        <form id="form-login">
            <div class="campo">   
                <label for="campo-email">Correo electrónico</label>
                <input type="email" id="campo-email" required>
            </div>
            
            <div class="campo">
                <label for="campo-password">Contraseña</label>
                <input type="password" id="campo-password" required>
            </div>

            <button type="submit">Iniciar sesión</button>
        </form>

        <p id="mensaje-estado"></p>
        
        <div class="enlace-registro">
            <a href="registro.html">¿No tienes cuenta? Regístrate</a>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
